<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <title>Churn Prediction</title>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --text-dark: #2d3436;
            --accent-color: #ff4757;
        }

        body {
            background: var(--primary-gradient);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            margin: 0;
        }

        /* Modern Navbar */
        .navbar {
            background: rgba(0, 0, 0, 0.2) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand-text, .nav-link-text, .nav-git-text {
            color: #fff !important;
            font-weight: 500;
            transition: 0.3s;
            margin: 0 15px;
        }

        .nav-git-text:hover { color: #ff4757 !important; text-decoration: none; }
        .navbar-brand-text:hover { color: #2ed573 !important; text-decoration: none; }

        /* Main Container */
        .main-wrapper {
            padding: 40px 15px;
        }

        .heading {
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.2);
        }

        /* Glassmorphism Form Card */
        .formContainer {
            background: var(--glass-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 1100px;
            margin: 0 auto;
        }

        .nametext {
            color: #4b4b4b;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: block;
        }

        /* Inputs & Selects */
        .custom-select, input[type=number] {
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            height: 45px !important;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .custom-select:focus, input[type=number]:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.25);
        }

        /* Predict Button */
        #submitbtn {
            background: var(--accent-color);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 700;
            width: 100%;
            margin-top: 32px;
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 1px;
        }

        #submitbtn:hover {
            background: #e84118;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        /* Output Window */
        .outputWindow {
            margin-top: 30px;
            text-align: center;
        }

        .alert {
            border-radius: 15px;
            padding: 20px;
            font-weight: 600;
            border: none;
            animation: fadeIn 0.5s ease-in;
        }

        .alert-danger {
            background: #ffeaa7;
            color: #d63031;
            border-left: 8px solid #ff4757;
        }

        .alert-success {
            background: #55efc4;
            color: #00b894;
            border-left: 8px solid #00b894;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-row {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>  
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand-text" href="/">HOME</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
          
            <!-- <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link-text" href="#">ABOUT</a>
                    </li>            
                </ul>          
            </div> -->
            <a class="nav-git-text" href="https://github.com/AweshAlam/Churn-Prediction-System.git" target="blank">GITHUB</a>
        </div>
    </nav>

    <div class="container main-wrapper">
        <h1 class="heading">Churn Prediction System</h1>

        <div class="formContainer">
            <form action="/" method="POST">
                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query1">Senior Citizen</label>
                        <select class="custom-select" id="query1" name="query1">
                            <option selected value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="form-group col-md-3">
                        <label class="nametext" for="query18">Payment Method</label>
                        <select class="custom-select" id="query18" name="query18">
                            <option selected value="Mailed check">Mailed check</option>
                            <option value="Electronic check">Electronic check</option>
                            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                            <option value="Credit card (automatic)">Credit card (automatic)</option>
                        </select>
                    </div>

                    <div class="form-group col-md-3">
                        <label class="nametext" for="query17">Paperless Billing</label>
                        <select class="custom-select" id="query17" name="query17">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="form-group col-md-3">
                        <label class="nametext" for="query4">Gender</label>
                        <select class="custom-select" id="query4" name="query4">
                            <option selected value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query5">Partner</label>
                        <select class="custom-select" id="query5" name="query5">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query6">Dependents</label>
                        <select class="custom-select" id="query6" name="query6">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query7">Phone Service</label>
                        <select class="custom-select" id="query7" name="query7">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query8">Multiple Lines</label>
                        <select class="custom-select" id="query8" name="query8">
                            <option selected value="Yes">Yes</option>
                            <option value="No phone service">No Phone Service</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query9">Internet Service</label>
                        <select class="custom-select" id="query9" name="query9">
                            <option selected value="DSL">DSL</option>
                            <option value="Fiber Optic">Fiber Optic</option>
                            <option value="No">None</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query10">Online Security</label>
                        <select class="custom-select" id="query10" name="query10">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query11">Online Backup</label>
                        <select class="custom-select" id="query11" name="query11">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query12">Device Protection</label>
                        <select class="custom-select" id="query12" name="query12">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query13">Tech Support</label>
                        <select class="custom-select" id="query13" name="query13">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query14">Streaming TV</label>
                        <select class="custom-select" id="query14" name="query14">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query15">Streaming Movies</label>
                        <select class="custom-select" id="query15" name="query15">
                            <option selected value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query16">Contract</label>
                        <select class="custom-select" id="query16" name="query16">
                            <option selected value="One year">One year</option>
                            <option value="Month-to-month">Month-to-month</option>
                            <option value="Two year">Two year</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query2">Monthly Charges</label>
                        <input type="number" id="query2" name="query2" min="1" max="999999" value="100" class="form-control">
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query3">Total Charges</label>
                        <input type="number" id="query3" name="query3" min="1" max="999999" value="100" class="form-control">
                    </div>
                    <div class="form-group col-md-3">
                        <label class="nametext" for="query19">Tenure (Months)</label>
                        <input type="number" id="query19" name="query19" min="1" max="500" value="1" class="form-control">
                    </div>
                    <div class="form-group col-md-3">
                        <button type="submit" class="btn btn-primary" name="submit" id="submitbtn" value="predict">PREDICT</button>
                    </div>
                </div>
            </form>

            <div class="outputWindow">
                {% if output1 %}
                    {% if output1 == "This customer is likely to be churned!!" %}
                        <div class="alert alert-danger" role="alert">
                            <strong>Status:</strong> {{output1}}<br>
                            <small>{{output2}}</small>
                        </div>
                    {% else %}
                        <div class="alert alert-success" role="alert">
                            <strong>Status:</strong> {{output1}}<br>
                            <small>{{output2}}</small>
                        </div>
                    {% endif %}
                {% endif %}
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
